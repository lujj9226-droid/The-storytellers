<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE STORYTELLERS</title>
    <!-- استدعاء خط كايرو -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0b0d12;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #161a23;
            border: 1px solid #2a3142;
            padding: 35px 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 15px rgba(128, 0, 32, 0.25);
            text-align: center;
        }

        .title {
            color: #800020; /* اللون العودي */
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="file"], input[type="text"], select {
            width: 100%;
            padding: 12px;
            background: #0b0d12;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: #800020; /* عودي */
            box-shadow: 0 0 8px rgba(128, 0, 32, 0.4);
        }

        .btn-submit {
            width: 100%;
            background: #800020; /* اللون العودي */
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background: #5c0017; /* عودي غامق للـ hover */
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        /* قسم أزرار المتابعة */
        .social-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #2a3142;
        }

        .social-title {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .social-links {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .social-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: #0b0d12;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f8fafc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .social-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .social-btn:hover {
            border-color: #800020;
            color: #e28099;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">THE STORYTELLERS</h1>
        <p class="subtitle">شاركونا لقطاتكم ولحظاتكم المميزة 📸🎬</p>

        <form id="uploadForm">
            <div class="form-group">
                <label>اختر صورة أو فيديو 📸🎬</label>
                <input type="file" id="mediaFile" accept="image/*,video/*" required>
            </div>

            <div class="form-group">
                <label>اختر المنصة 📲</label>
                <select id="platformSelect">
                    <option value="Instagram">إنستغرام (Instagram)</option>
                    <option value="TikTok">تيك توك (TikTok)</option>
                </select>
            </div>

            <div class="form-group">
                <label>اسم الحساب (Username) 👤</label>
                <input type="text" id="socialUser" placeholder="@username" required>
            </div>

            <button type="submit" class="btn-submit">إرسال القصة ✨</button>
        </form>

        <div id="status"></div>

        <!-- قسم حسابات The Storytellers -->
        <div class="social-section">
            <p class="social-title">تابعونا للمزيد من القصص واللحظات المميزة ✨</p>
            <div class="social-links">
                <a href="https://www.instagram.com/thestorytellers_ksa?stkn=eGY4YzFybGFpNWhz" target="_blank" class="social-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    Instagram
                </a>
                <a href="https://www.tiktok.com/@thestorytellers_sa?_r=1&_t=ZS-99asAsoHWkP" target="_blank" class="social-btn">
                    <svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.82.56-1.31 1.54-1.28 2.53.02 1.04.61 2.01 1.53 2.5.8.43 1.76.49 2.63.22.95-.28 1.73-1.02 1.99-1.96.11-.47.12-.96.12-1.45V.02z"/></svg>
                    TikTok
                </a>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_NAME = 'yxusnhxg';
        const UPLOAD_PRESET = 'The storytellers';

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('mediaFile');
            const platform = document.getElementById('platformSelect').value;
            const socialUser = document.getElementById('socialUser').value.replace('@', '').trim();
            const statusDiv = document.getElementById('status');

            if (!fileInput.files[0]) {
                alert('الرجاء اختيار ملف أولاً');
                return;
            }

            statusDiv.style.color = '#38bdf8';
            statusDiv.innerText = 'جاري رفع القصة... يرجى الانتظار ⏳';

            const customPublicId = `${platform}_${socialUser}_${Date.now()}`;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('public_id', customPublicId); 

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    statusDiv.style.color = '#4ade80';
                    statusDiv.innerText = 'تم الإرسال بنجاح! شكراً لمشاركتك ❤️';
                    document.getElementById('uploadForm').reset();
                } else {
                    throw new Error('حدث خطأ أثناء الرفع');
                }
            } catch (error) {
                statusDiv.style.color = '#f87171';
                statusDiv.innerText = 'فشل الإرسال، يرجى المحاولة مرة أخرى ❌';
            }
        });
    </script>
</body>
</html>

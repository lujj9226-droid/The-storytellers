<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE STORYTELLERS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0d12;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #161a23;
            border: 1px solid #2a3142;
            padding: 35px 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 15px rgba(225, 29, 72, 0.15);
            text-align: center;
        }

        .title {
            color: #e11d48;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="file"], input[type="text"], select {
            width: 100%;
            padding: 12px;
            background: #0b0d12;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: #e11d48;
            box-shadow: 0 0 8px rgba(225, 29, 72, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: #e11d48;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background: #be123c;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        /* قسم حسابات التواصل الاجتماعي */
        .social-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #2a3142;
        }

        .social-title {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .social-links {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .social-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px;
            background: #0b0d12;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: #e11d48;
            color: #e11d48;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">THE STORYTELLERS</h1>
        <p class="subtitle">شاركونا لقطاتكم ولحظاتكم المميزة 📸🎬</p>

        <form id="uploadForm">
            <div class="form-group">
                <label>اختر صورة أو فيديو 📸🎬</label>
                <input type="file" id="mediaFile" accept="image/*,video/*" required>
            </div>

            <div class="form-group">
                <label>اختر المنصة 📲</label>
                <select id="platformSelect">
                    <option value="Instagram">إنستغرام (Instagram)</option>
                    <option value="TikTok">تيك توك (TikTok)</option>
                </select>
            </div>

            <div class="form-group">
                <label>اسم الحساب (Username) 👤</label>
                <input type="text" id="socialUser" placeholder="@username" required>
            </div>

            <button type="submit" class="btn-submit">إرسال القصة ✨</button>
        </form>

        <div id="status"></div>

        <!-- أزرار حسابات The Storytellers -->
        <div class="social-section">
            <p class="social-title">تابعوا مجتمع The Storytellers 🔗</p>
            <div class="social-links">
                <a href="https://instagram.com/thestorytellers.sa" target="_blank" class="social-btn">
                    👑 Instagram
                </a>
                <a href="https://tiktok.com/@thestorytellers.sa" target="_blank" class="social-btn">
                    🎵 TikTok
                </a>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_NAME = 'yxusnhxg';
        const UPLOAD_PRESET = 'The storytellers';

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('mediaFile');
            const platform = document.getElementById('platformSelect').value;
            const socialUser = document.getElementById('socialUser').value.replace('@', '').trim();
            const statusDiv = document.getElementById('status');

            if (!fileInput.files[0]) {
                alert('الرجاء اختيار ملف أولاً');
                return;
            }

            statusDiv.style.color = '#38bdf8';
            statusDiv.innerText = 'جاري رفع القصة... يرجى الانتظار ⏳';

            // تسمية الملف بالمنصة واسم المستخدم مع التوقيت لمنع تكرار الأسماء
            const customPublicId = `${platform}_${socialUser}_${Date.now()}`;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('public_id', customPublicId); 

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    statusDiv.style.color = '#4ade80';
                    statusDiv.innerText = 'تم الإرسال بنجاح! شكراً لمشاركتك ❤️';
                    document.getElementById('uploadForm').reset();
                } else {
                    throw new Error('حدث خطأ أثناء الرفع');
                }
            } catch (error) {
                statusDiv.style.color = '#f87171';
                statusDiv.innerText = 'فشل الإرسال، يرجى المحاولة مرة أخرى ❌';
            }
        });
    </script>
</body>
</html>
